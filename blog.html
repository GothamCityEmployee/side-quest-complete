<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blog — Side Quest Complete</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    body { min-height: 100vh; }

    .blog-page {
      padding: 100px 0 80px;
    }

    /* ── Post list view ── */
    .blog-hero {
      text-align: center;
      margin-bottom: 48px;
    }

    /* ── Single post view ── */
    #post-view { display: none; }
    #list-view  { display: block; }

    .post-back {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--color-purple);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 32px;
      background: none;
      border: none;
      padding: 0;
      transition: opacity .2s;
    }
    .post-back:hover { opacity: .75; }

    .post-wrap {
      max-width: 740px;
      margin: 0 auto;
      padding: 0 24px;
    }

    .post-thumb {
      width: 100%;
      height: 260px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 5rem;
      margin-bottom: 32px;
    }

    .post-meta-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .post-tag {
      background: rgba(176,58,245,.15);
      color: var(--color-purple);
      border: 1px solid rgba(176,58,245,.3);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .post-date {
      color: var(--gray-600);
      font-size: 0.8rem;
    }

    .post-title {
      font-family: var(--font-pixel);
      font-size: clamp(0.75rem, 2.5vw, 1.1rem);
      color: white;
      line-height: 1.8;
      margin-bottom: 24px;
    }

    .post-body {
      color: #ccc;
      font-size: 1rem;
      line-height: 1.85;
    }

    .post-body p {
      margin-bottom: 20px;
    }

    .post-body h2 {
      font-family: var(--font-pixel);
      font-size: 0.75rem;
      color: var(--neon);
      margin: 32px 0 16px;
      line-height: 1.6;
    }

    .post-body ul {
      list-style: disc;
      padding-left: 24px;
      margin-bottom: 20px;
    }

    .post-body ul li {
      margin-bottom: 10px;
    }

    .post-body strong { color: white; }

    .post-divider {
      border: none;
      border-top: 1px solid #222;
      margin: 40px 0;
    }

    .more-posts-title {
      font-family: var(--font-pixel);
      font-size: 0.65rem;
      color: var(--muted, #888);
      margin-bottom: 24px;
      letter-spacing: .05em;
    }

    /* ── Empty state ── */
    .blog-empty {
      text-align: center;
      padding: 60px 20px;
      color: #666;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header id="site-header" role="banner">
    <nav class="nav container" aria-label="Main navigation">
      <a href="index.html" class="nav-logo" aria-label="Side Quest Complete — Home">
        <img src="logos/Misc Logos.PNG" alt="Side Quest Complete logo" style="height:36px;width:auto;object-fit:contain;" />
        
      </a>
      <ul class="nav-links" id="nav-links" role="list">
        <li><a href="index.html#shop">Shop</a></li>
        <li><a href="index.html#categories">Browse</a></li>
        <li><a href="index.html#about">About</a></li>
        <li><a href="blog.html" class="active">Blog</a></li>
        <li><a href="index.html#contact">Contact</a></li>
      </ul>
      <div class="nav-right">
        <a href="checkout.html" style="color:#aaa;font-size:0.8rem;text-decoration:none;margin-right:12px;">🛒 Cart</a>
        <button class="menu-toggle" id="menu-toggle" aria-label="Toggle menu" aria-expanded="false" aria-controls="nav-links">
          <span></span><span></span><span></span>
        </button>
      </div>
    </nav>
  </header>

  <main class="blog-page">
    <div class="container">

      <!-- ── LIST VIEW ── -->
      <div id="list-view">
        <div class="blog-hero">
          <h1 class="section-title">From the Vault</h1>
          <p class="section-sub">Retro gaming thoughts, finds, and lore.</p>
        </div>
        <div class="blog-grid" id="blog-list"></div>
      </div>

      <!-- ── SINGLE POST VIEW ── -->
      <div id="post-view">
        <div class="post-wrap">
          <button class="post-back" onclick="showList()">← Back to Blog</button>
          <div class="post-thumb" id="post-thumb"></div>
          <div class="post-meta-row">
            <span class="post-tag" id="post-tag"></span>
            <span class="post-date" id="post-date"></span>
          </div>
          <h1 class="post-title" id="post-title"></h1>
          <div class="post-body" id="post-body"></div>
          <hr class="post-divider" />
          <p class="more-posts-title">MORE FROM THE VAULT</p>
          <div class="blog-grid" id="more-posts"></div>
        </div>
      </div>

    </div>
  </main>

  <script src="supabase.js"></script>
  <script>
  (function() {
    var posts = [];

    // ── Render a card ─────────────────────────────────────────────────────────
    function blogCard(p, onclick) {
      return '<article class="blog-card" style="cursor:pointer" onclick="' + onclick + '">' +
        '<div class="blog-thumb" style="background:' + p.thumbBg + '">' + p.thumbEmoji + '</div>' +
        '<div class="blog-body">' +
          '<div class="blog-meta">' +
            '<span class="blog-tag">' + p.tag + '</span>' +
            '<span class="blog-date">' + p.date + '</span>' +
          '</div>' +
          '<h3 class="blog-title">' + p.title + '</h3>' +
          '<p class="blog-excerpt">' + p.excerpt + '</p>' +
          '<span class="blog-read-more">Read More →</span>' +
        '</div>' +
      '</article>';
    }

    // ── List view ─────────────────────────────────────────────────────────────
    function showList() {
      document.getElementById('list-view').style.display = 'block';
      document.getElementById('post-view').style.display = 'none';
      window.scrollTo({ top: 0, behavior: 'smooth' });
      history.replaceState(null, '', 'blog.html');
    }
    window.showList = showList;

    function renderList() {
      var grid = document.getElementById('blog-list');
      if (!posts.length) {
        grid.innerHTML = '<div class="blog-empty"><p>No posts yet. Check back soon!</p></div>';
        return;
      }
      grid.innerHTML = posts.map(function(p) {
        return blogCard(p, 'showPost(' + p.id + ')');
      }).join('');
    }

    // ── Single post view ──────────────────────────────────────────────────────
    function showPost(id) {
      var p = posts.find(function(x) { return x.id === id; });
      if (!p) return;

      document.getElementById('post-thumb').style.background = p.thumbBg;
      document.getElementById('post-thumb').textContent = p.thumbEmoji;
      document.getElementById('post-tag').textContent = p.tag;
      document.getElementById('post-date').textContent = p.date;
      document.getElementById('post-title').textContent = p.title;
      document.getElementById('post-body').innerHTML = p.content ||
        '<p>' + p.excerpt + '</p><p style="color:#555;font-style:italic">Full article coming soon.</p>';

      // More posts (exclude current)
      var others = posts.filter(function(x) { return x.id !== id; }).slice(0, 2);
      document.getElementById('more-posts').innerHTML = others.map(function(x) {
        return blogCard(x, 'showPost(' + x.id + ')');
      }).join('');

      document.getElementById('list-view').style.display = 'none';
      document.getElementById('post-view').style.display = 'block';
      window.scrollTo({ top: 0, behavior: 'smooth' });
      history.replaceState(null, '', 'blog.html?post=' + id);
    }
    window.showPost = showPost;

    // ── Fetch from Supabase ───────────────────────────────────────────────────
    async function loadPosts() {
      var grid = document.getElementById('blog-list');
      grid.innerHTML = '<div class="blog-empty"><p>Loading posts...</p></div>';

      var { data, error } = await window.sqc.from('blogs').select('*').order('created_at', { ascending: false });
      if (error || !data) {
        grid.innerHTML = '<div class="blog-empty"><p>Could not load posts.</p></div>';
        return;
      }

      posts = data.map(function(r) {
        return {
          id: r.id,
          title: r.title,
          tag: r.tag,
          date: r.date,
          excerpt: r.excerpt,
          thumbEmoji: r.thumb_emoji,
          thumbBg: r.thumb_bg,
          content: r.content
        };
      });

      renderList();

      // Check if URL has ?post=X
      var params = new URLSearchParams(location.search);
      var postId = parseInt(params.get('post'));
      if (postId) showPost(postId);
    }

    // ── Init ──────────────────────────────────────────────────────────────────
    if (window.sqc) {
      loadPosts();
    } else {
      window.addEventListener('sqc:ready', loadPosts, { once: true });
    }

    // Mobile hamburger
    var menuToggle = document.getElementById('menu-toggle');
    if (menuToggle) {
      menuToggle.addEventListener('click', function() {
        var nav = document.getElementById('nav-links');
        var open = nav.classList.toggle('open');
        menuToggle.setAttribute('aria-expanded', String(open));
      });
    }
  })();
  </script>

</body>
</html>
